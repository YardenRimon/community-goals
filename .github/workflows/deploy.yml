name: CI and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build project (if app initialized) or stage static infrastructure
        run: |
          if [ -f "package.json" ]; then
            echo "Detected package.json - running Node build..."
            npm ci
            npm run build
            ARTIFACT_DIR="dist"
          else
            echo "Infrastructure & docs stage - staging static site..."
            mkdir -p _site
            cp index.html _site/
            cp -r demo _site/demo
            cp -r docs _site/docs
            cp README.md _site/README.md
            ARTIFACT_DIR="_site"
          fi
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> $GITHUB_ENV

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ARTIFACT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
